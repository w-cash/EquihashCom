# /etc/nginx/sites-available/equihash.com — TLS in front of the app on 127.0.0.1:8080.
# Certificates: certbot --nginx -d equihash.com -d www.equihash.com (or any ACME client).
# The app sends CSP (with frame-ancestors 'none'), X-Content-Type-Options, Referrer-Policy,
# X-Frame-Options and Permissions-Policy itself; nginx passes them through and adds HSTS.

server {
    listen 80;
    listen [::]:80;
    server_name equihash.com www.equihash.com;
    return 301 https://equihash.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name equihash.com;

    ssl_certificate     /etc/letsencrypt/live/equihash.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/equihash.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    server_tokens off;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    location = /healthz {
        proxy_pass http://127.0.0.1:8080;
        access_log off;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.equihash.com;
    ssl_certificate     /etc/letsencrypt/live/equihash.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/equihash.com/privkey.pem;
    return 301 https://equihash.com$request_uri;
}
