[package]
name = "equihash-site"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
resolver = "3"
description = "equihash.com: neutral Equihash mining pool directory (Actix Web, server-rendered)"
license = "MIT"
default-run = "equihash-site"

[dependencies]
actix-web = "4"
actix-files = "0.6"
maud = { version = "0.26", features = ["actix-web"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
env_logger = "0.11"
log = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true
